name: ci
on:
  push:
    branches: [main]
  pull_request:
# NOTE (2026-09-10): github-hosted runners are blocked by an account
# billing flag, so CI runs on the always-on Mac (caret-mac) until billing
# is fixed — then restore the ubuntu/macos/windows matrix.
jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci-validate.mjs
